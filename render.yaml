services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Prisma)
  # -------------------------------------------------------------
  - type: web
    name: pms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pms-database
          property: connectionString

  # -------------------------------------------------------------
  # 2. Frontend Single Page Application (React + Vite + Tailwind)
  # -------------------------------------------------------------
  - type: web
    name: pms-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# -------------------------------------------------------------
# Managed PostgreSQL Database (Render Free Tier)
# -------------------------------------------------------------
databases:
  - name: pms-database
    plan: free
    databaseName: pms_store
    user: pms_admin
